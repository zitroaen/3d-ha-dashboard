# Eigenes Modell (Beispiel): Wandregal mit Parametern
id: wandregal
name: Wandregal
category: furniture
params:
  breite: 1.2
  holz: oak_light
materials:
  holz: $holz
  metall: black_matte
parts:
  - box: { size: [$breite, 0.025, 0.24], at: [0, 1.2, 0], radius: 0.004, material: holz }
  - box: { size: [$breite, 0.025, 0.24], at: [0, 1.55, 0], radius: 0.004, material: holz }
  - rod: { from: ["$breite / 2 - 0.1", 1.1, -0.11], to: ["$breite / 2 - 0.1", 1.62, -0.11], radius: 0.008, material: metall }
  - rod: { from: ["0.1 - $breite / 2", 1.1, -0.11], to: ["0.1 - $breite / 2", 1.62, -0.11], radius: 0.008, material: metall }
  - box: { size: [0.18, 0.22, 0.16], at: ["0.25 - $breite / 2", 1.325, 0], material: book_mix }

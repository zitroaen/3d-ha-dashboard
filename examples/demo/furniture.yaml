# Einrichtung des Demo-Hauses. Format: siehe docs/DATA_FORMAT.md.
# Unabhängig vom Hausmodell (house.json): Möbel umstellen = nur hier anpassen (oder im Editiermodus).
#
#   id          eindeutig, stabil
#   kind        Modell aus src/models.js (FURNITURE)
#   floor/room  Etage und Raum-ID aus house.json
#   pos         [x, y] Mittelpunkt in Metern, Plan-Koordinaten
#   rot         Drehung in Grad im Uhrzeigersinn (von oben). Bei 0 zeigt die Vorderseite nach Plan-unten (+y)
#   size        [Breite, Tiefe, Höhe] in Metern (optional)
#   elevation   Unterkante über dem Boden (Bilder, TV, Vorhänge, Heizkörper)
#   color       Material aus PALETTE in src/models.js (optional)
#   texture     Bilddatei relativ zum Datenordner (bei picture), z. B. textures/gemaelde.jpg


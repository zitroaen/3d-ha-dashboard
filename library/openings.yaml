# Beispiel-Bibliothek der Engine: Fenster- und Türarten. Die Instanz ergänzt oder ändert sie in model.yaml unter
# `window_styles` / `door_styles` (gleiche ID = Werte ändern, `base: <id>` = ableiten) und wählt sie je Öffnung
# (`style`) oder je Gebäude (`buildings[].styles: { window, door, exterior_door, front_door }`). Format: docs/LIBRARY.md.
# Maße in Metern, Farben #rrggbb (ohne Farbe: weißer Kunststoff bzw. Holz-Fensterbank).

windows:
  standard: { label: Kunststofffenster weiß, frame: 0.065, depth: 0.075, sash: 0.055 }
  wood: { label: Holzfenster, frame: 0.075, depth: 0.08, sash: 0.06, color: '#6b4a2e' }
  bars: { label: Sprossenfenster, base: standard, bars: [1, 2] }
  wood_bars: { label: Holz-Sprossenfenster, base: wood, bars: [2, 3] }
  anthracite: { label: Alufenster anthrazit, frame: 0.05, depth: 0.07, sash: 0.04, color: '#3b3f44', board: '#9a9a96' }
  fixed: { label: Festverglasung, base: anthracite, fixed: true }

doors:
  interior: { label: Innentür mit Füllung, leaf: panel, panels: 1 }
  interior_panels: { label: Innentür Kassetten, leaf: panel, panels: 3 }
  interior_flush: { label: Innentür glatt, leaf: flush }
  interior_glass: { label: Innentür mit Glas, leaf: glass }
  interior_oak: { label: Innentür Eiche, leaf: flush, color: '#a3825c', frame_color: '#a3825c', handle: '#2b2b2b' }
  patio: { label: Terrassentür, kind: exterior, leaf: glass }
  patio_bars: { label: Terrassentür mit Sprossen, base: patio, bars: [1, 3] }
  front: { label: Haustür massiv, kind: exterior, leaf: solid }
  front_glass: { label: Haustür mit Glasfeldern, kind: exterior, leaf: solid, glass: 3, color: '#3b3f44' }

name: Release

# Release für HACS (Kategorie Integration): baut das Bundle, packt die Integration custom_components/ha_3d_dashboard
# samt Bundle in dist/ha_3d_dashboard.zip (das lädt HACS) und hängt zusätzlich dist/ha-3d-dashboard.js an
# (für die Installation von Hand mit panel_custom).
#
# Automatisch: Sobald die Tests auf main grün sind und es zur Version aus package.json noch kein Release gibt.
# Eine neue Version veröffentlichen = Version in package.json und manifest.json erhöhen und nach main mergen.
# Von Hand: Actions → Release → Run workflow (nur von main, nur wenn die Tests für diesen Stand grün waren).
# Die Tests laufen hier nicht noch einmal – sie sind für genau diesen Commit schon gelaufen.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Version bestimmen und prüfen
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Release nur von main aus starten (aktuell: $GITHUB_REF)"; exit 1
            fi
            OK=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
            if [ "$OK" = "0" ]; then
              echo "::error::Für $SHA gibt es keinen grünen Testlauf – erst Tests laufen lassen"; exit 1
            fi
          fi
          VERSION=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./custom_components/ha_3d_dashboard/manifest.json').version")
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::error::package.json ($VERSION) und manifest.json ($MANIFEST) haben unterschiedliche Versionen"; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION gibt es schon – nichts zu tun"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.SKIP != '1'
      - run: npm run build && npm run package
        if: env.SKIP != '1'
      - name: GitHub-Release erstellen
        if: env.SKIP != '1'
        run: |
          gh release create "v$VERSION" dist/ha_3d_dashboard.zip dist/ha-3d-dashboard.js \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --generate-notes

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D-HA-Dashboard – Test-Harness</title>
  <style>html, body { margin: 0; height: 100%; background: #000; } body:not(.ha) ha-3d-dashboard { position: fixed; inset: 0; }
    /* ?ha=1: eingebettet wie in HA ab 2026.9 – partial-panel-resolver ist inline, ha-panel-custom ein Block ohne Höhe */
    .resolver { display: inline; } .panel-custom { display: block; }</style>
</head>
<body>
  <script>
    // Vor dem Panel (es liest seine Ansichts-Einstellungen beim Anlegen): automatisierte Tests rechnen schnell
    // (Qualität „Sparsam“, keine Ruhebild-Verfeinerung); Screenshots und Leistungstest schalten „Hoch“ selbst ein,
    // ?quality= überschreibt. Die Vorschau im Browser bleibt unberührt.
    try {
      const want = new URLSearchParams(location.search).get('quality') || (navigator.webdriver ? 'low' : null);
      if (want && !localStorage.getItem('ha3d_view_prefs')) localStorage.setItem('ha3d_view_prefs', JSON.stringify({ quality: want }));
    } catch { /* ohne Speicher: Standard */ }
  </script>
  <span class="resolver"><div class="panel-custom"><ha-3d-dashboard></ha-3d-dashboard></div></span>
  <script type="module">
    import '../dist/ha-3d-dashboard.js';
    import { createMockHass, statesFromModel } from './mock-hass.js';
    import { load as parseYaml } from '../node_modules/js-yaml/dist/js-yaml.mjs';

    const el = document.querySelector('ha-3d-dashboard');
    // Daten direkt aus dem Repo laden: Änderungen in data/ sind nach einem Neuladen sichtbar, ohne Build
    // save_url: der Dev-Server (npm run serve) schreibt Editor-Änderungen direkt nach data/
    // Varianten für die Demo-Tests: ?demo=1 (config.demo) bzw. ?nodata=1 (Daten nicht erreichbar -> Demo-Fallback)
    // ?shared=1: wie mit der Integration (gemeinsamer Speicher, simuliert in mock-hass.js), &user=1: kein Administrator
    const q = new URLSearchParams(location.search);
    document.body.classList.toggle('ha', q.has('ha'));
    // ?top=47: Panel beginnt tiefer, wie in der iOS-App unter der Statusleiste
    if (q.has('top')) document.body.style.paddingTop = `${q.get('top')}px`;
    el.panel = { config: q.has('demo') ? { demo: true } : q.has('nodata') ? { data_url: q.has('shared') ? '/fehlt/' : '/fehlt', shared: q.has('shared') }
      : q.has('shared') ? { data_url: '/data/', shared: true } : { data_url: '/data/', save_url: '/__save/' } };

    // Simuliertes HA wie die echte Installation: alle Entities aus dem HA-Export (reference/entities.txt) mit
    // Bereich (wie hass.states + Entity-/Bereichs-Registry) plus jede im Modell verknüpfte Entity –
    // alles aus, Nacht als Ausgangszustand
    const model = parseYaml(await (await fetch('/data/model.yaml')).text()) || {};
    const exported = {}, entities = {}, areas = {};
    try {
      let area = null;
      const slug = (n) => n.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '_');
      const exportText = await (await fetch('/reference/entities.txt')).text();
      for (const line of exportText.split(/\r?\n/)) {
        if (line.startsWith('## ')) {
          const name = line.slice(3).trim();
          area = name === 'Ohne Bereich' ? null : slug(name);
          if (area) areas[area] = { area_id: area, name };
          continue;
        }
        const [id, name] = line.split('|').map((s) => s?.trim());
        if (!id || !/^[a-z_]+\.[a-z0-9_]+$/.test(id)) continue;
        const dom = id.split('.')[0];
        exported[id] = { entity_id: id, state: ['light', 'switch', 'binary_sensor'].includes(dom) ? 'off' : 'unknown', attributes: { friendly_name: name } };
        entities[id] = { entity_id: id, area_id: area };
      }
    } catch { /* ohne Export geht es auch */ }
    const hass = createMockHass({
      ...exported,
      ...statesFromModel(model),
      'sun.sun': { state: 'below_horizon', attributes: { azimuth: 330, elevation: -25, friendly_name: 'Sun' } },
      // Wetter wie die Wetter-Integration von HA (Standard-Entity weather.home)
      'weather.home': { state: 'clear-night', attributes: { temperature: 14.2, temperature_unit: '°C', friendly_name: 'Zuhause' } },
    }, (h) => { el.hass = h; });
    // Darstellung wie in HA (hass.themes.darkMode); ?light=1 = helles HA-Design
    Object.assign(hass, { entities, areas, devices: {}, themes: { darkMode: !q.has('light') } });
    if (q.has('user')) hass.user = { name: 'Gast', is_admin: false };
    el.hass = hass;
    el.narrow = matchMedia('(max-width: 870px)').matches;
    window.panel = el;
    window.mockHass = hass;
    el.whenReady().then(() => { window.panelReady = true; });
  </script>
</body>
</html>
